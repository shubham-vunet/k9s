name: Build RISC-V64

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build riscv64
        env:
          GOOS: linux
          GOARCH: riscv64
        run: |
          go build -o k9s-linux-riscv64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: k9s-linux-riscv64
          path: k9s-linux-riscv64